services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: memorias-vivas-app

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      mysql:
        condition: service_healthy


  nginx:
    image: nginx:alpine

    container_name: memorias-vivas-nginx

    ports:
      - "8080:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app


  mysql:
    image: mysql:8.4

    container_name: memorias-vivas-mysql

    environment:
      MYSQL_DATABASE: memorias_vivas
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mysql_data: